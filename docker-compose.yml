services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - market-signal-scanner-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      KITE_MARKET_DATA_ENABLED: ${KITE_MARKET_DATA_ENABLED:-false}
      KITE_ORDER_ROUTING_ENABLED: ${KITE_ORDER_ROUTING_ENABLED:-false}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_REDIRECT_URL: ${KITE_REDIRECT_URL:-http://127.0.0.1:8080/api/v1/integrations/zerodha/callback}
      KITE_WEBSOCKET_BASE_URL: ${KITE_WEBSOCKET_BASE_URL:-wss://ws.kite.trade}
      QUANTPILOT_SECURITY_ENABLED: ${QUANTPILOT_SECURITY_ENABLED:-false}
      QUANTPILOT_SECURITY_USERNAME: ${QUANTPILOT_SECURITY_USERNAME:-}
      QUANTPILOT_SECURITY_PASSWORD: ${QUANTPILOT_SECURITY_PASSWORD:-}
      QUANTPILOT_SECURITY_PASSWORD_HASH: ${QUANTPILOT_SECURITY_PASSWORD_HASH:-}
      QUANTPILOT_ALLOWED_ORIGIN: ${QUANTPILOT_ALLOWED_ORIGIN:-http://127.0.0.1:8080}
      QUANTPILOT_API_RATE_LIMIT: ${QUANTPILOT_API_RATE_LIMIT:-120}
      SESSION_COOKIE_HTTP_ONLY: ${SESSION_COOKIE_HTTP_ONLY:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-strict}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  market-signal-scanner-postgres:
